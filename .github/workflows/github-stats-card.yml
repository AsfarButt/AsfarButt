name: Update GitHub Stats Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.STATS_CARD_TOKEN }}
          PROFILE_USERNAME: AsfarButt
        run: python scripts/generate_stats_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-card.svg
          git diff --staged --quiet || git commit -m "chore: update stats card [skip ci]"
          git push
